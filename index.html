<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeLine AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#08111f,#102a43);
  color:white;
}
.container{
  max-width:900px;
  margin:auto;
  padding:30px 20px;
}
header{text-align:center;margin-bottom:25px}
.logo{font-size:42px}
h1{margin:5px;font-size:38px}
.subtitle{color:#b8c7d9;font-size:17px}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
  backdrop-filter:blur(10px);
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}
input,textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #526579;
  background:#07101c;
  color:white;
  margin-bottom:15px;
}
textarea{min-height:150px;resize:vertical}

button{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}
.primary{background:#42e8a4;color:#07101c}
.secondary{background:#29445e;color:white}
button:hover{transform:translateY(-1px)}

#preview{
  max-width:220px;
  max-height:180px;
  border-radius:12px;
  display:none;
  margin:10px 0;
}

.result{
  white-space:pre-wrap;
  line-height:1.6;
  color:#e9f2ff;
}
.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:#163d34;
  color:#65f0b0;
  margin-bottom:12px;
}
.small{color:#9fb1c5;font-size:13px}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">🛟</div>
  <h1>LifeLine AI</h1>
  <div class="subtitle">
    From messy human intent → structured, verified, actionable information
  </div>
</header>

<div class="card">

<label>Gemini API Key</label>
<input id="apiKey" type="password"
placeholder="Enter your Gemini API key for this demo">

<p class="small">
Your key is used only by this browser session. Do NOT put your API key inside the GitHub code.
</p>

<label>Tell LifeLine what happened</label>

<textarea id="input"
placeholder="Example: My father suddenly feels dizzy and weak. We are near Bhartiya City and need help understanding what to do."></textarea>

<div>
  <button class="secondary" onclick="startVoice()">🎙️ Speak</button>

  <label style="display:inline-block;margin-left:10px">
    📷 Add photo
    <input id="imageInput" type="file" accept="image/*"
           style="display:none" onchange="showImage(event)">
  </label>
</div>

<img id="preview">

<br>

<button class="primary" onclick="analyze()">✨ Analyze with Gemini</button>

</div>

<div class="card" id="outputCard" style="display:none">

<div class="badge">✓ Gemini Analysis</div>

<h2>Structured Understanding</h2>

<div id="result" class="result"></div>

</div>

</div>

<script>

let imageData = null;

function showImage(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    imageData = e.target.result.split(",")[1];

    const preview = document.getElementById("preview");
    preview.src = e.target.result;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
}

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.start();

  recognition.onresult = function(event){
    document.getElementById("input").value =
      event.results[0][0].transcript;
  };
}

async function analyze(){

  const apiKey =
    document.getElementById("apiKey").value.trim();

  const userInput =
    document.getElementById("input").value.trim();

  if(!apiKey){
    alert("Please enter your Gemini API key.");
    return;
  }

  if(!userInput && !imageData){
    alert("Please enter text, speak something, or add a photo.");
    return;
  }

  const result =
    document.getElementById("result");

  document.getElementById("outputCard")
    .style.display="block";

  result.textContent =
    "Gemini is analyzing the information...";

  const prompt = `
You are LifeLine AI, a universal bridge between messy human intent
and complex systems.

Analyze the user's real-world input.

Your job is NOT to invent facts.

Return a clear structured response with exactly these sections:

INTENT:
What does the person appear to need?

CATEGORY:
Medical / Travel / Weather / Traffic / News / Safety / Other

KEY INFORMATION:
List the important facts extracted from the input.

MISSING INFORMATION:
List important information that is missing.

VERIFICATION:
Clearly separate facts provided by the user from assumptions.
Never claim something is verified when it is not.

URGENCY:
Low / Medium / High / Emergency
Explain briefly.

ACTION PLAN:
Give practical next steps based only on the available information.

IMPORTANT:
For medical or emergency situations, do not diagnose.
Recommend contacting appropriate qualified professionals or emergency
services when the situation may be serious.

Keep the answer concise and easy to understand.
`;

  const parts = [
    {text: prompt + "\n\nUSER INPUT:\n" + userInput}
  ];

  if(imageData){
    parts.push({
      inline_data:{
        mime_type:"image/jpeg",
        data:imageData
      }
    });
  }

  try{

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "x-goog-api-key":apiKey
        },

        body:JSON.stringify({
          contents:[
            {
              parts:parts
            }
          ]
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error?.message || "Gemini API request failed"
      );
    }

    const text =
      data.candidates?.[0]?.content?.parts
      ?.map(p => p.text || "")
      .join("") ||
      "No response received.";

    result.textContent = text;

  }catch(error){

    result.textContent =
      "Error: " + error.message +
      "\n\nCheck your Gemini API key and internet connection.";
  }
}

</script>

</body>
</html>
