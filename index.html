<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeLine AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#08111f,#102a43);
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px 20px;
}

header{
  text-align:center;
  margin-bottom:25px
}

.logo{font-size:42px}

h1{
  margin:5px;
  font-size:38px
}

.subtitle{
  color:#b8c7d9;
  font-size:17px
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
  backdrop-filter:blur(10px);
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input,textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #526579;
  background:#07101c;
  color:white;
  margin-bottom:15px;
}

textarea{
  min-height:150px;
  resize:vertical
}

button{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}

.primary{
  background:#42e8a4;
  color:#07101c
}

.secondary{
  background:#29445e;
  color:white
}

.demo{
  background:#5b8cff;
  color:white
}

button:hover{
  transform:translateY(-1px)
}

#preview{
  max-width:220px;
  max-height:180px;
  border-radius:12px;
  display:none;
  margin:10px 0;
}

.result{
  white-space:pre-wrap;
  line-height:1.6;
  color:#e9f2ff;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:#163d34;
  color:#65f0b0;
  margin-bottom:12px;
}

.demoBadge{
  background:#243968;
  color:#8fb2ff;
}

.small{
  color:#9fb1c5;
  font-size:13px
}

.divider{
  text-align:center;
  color:#8093a8;
  margin:12px 0;
}

.status{
  text-align:center;
  margin-top:10px;
  color:#9fb1c5;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">🛟</div>
  <h1>LifeLine AI</h1>

  <div class="subtitle">
    From messy human intent → structured, verified, actionable information
  </div>
</header>


<div class="card">

<label>Gemini API Key</label>

<input
  id="apiKey"
  type="password"
  placeholder="Enter an approved Gemini API key for this demo">

<p class="small">
For an approved Gemini setup only. Never put your API key inside the
GitHub code.
</p>


<label>Tell LifeLine what happened</label>

<textarea
  id="input"
  placeholder="Example: There is heavy traffic near my college and I need to know what information I should check before choosing another route.">
</textarea>


<div>

  <button class="secondary" onclick="startVoice()">
    🎙️ Speak
  </button>


  <label style="display:inline-block;margin-left:10px">

    📷 Add photo

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      style="display:none"
      onchange="showImage(event)"
    >

  </label>

</div>


<img id="preview">


<br>


<button class="primary" onclick="analyzeWithGemini()">
  ✨ Analyze with Gemini
</button>


<button class="demo" onclick="runDemo()">
  🧪 Try Demo Mode
</button>


<div class="status">
  Demo Mode works without Gemini API access.
</div>

</div>


<div class="card" id="outputCard" style="display:none">

<div id="badge" class="badge">
  ✓ LifeLine Analysis
</div>

<h2>Structured Understanding</h2>

<div id="result" class="result"></div>

</div>

</div>


<script>

let imageData = null;


/* =========================
   IMAGE UPLOAD
========================= */

function showImage(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    imageData = e.target.result;

    const preview =
      document.getElementById("preview");

    preview.src = e.target.result;

    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.start();

  recognition.onresult =
    function(event){

      document.getElementById("input").value =
        event.results[0][0].transcript;

    };
}


/* =========================
   SHOW RESULT
========================= */

function showResult(text, mode){

  const outputCard =
    document.getElementById("outputCard");

  const result =
    document.getElementById("result");

  const badge =
    document.getElementById("badge");

  outputCard.style.display = "block";

  result.textContent = text;

  if(mode === "demo"){

    badge.textContent =
      "🧪 Demo Mode";

    badge.className =
      "badge demoBadge";

  }else{

    badge.textContent =
      "✓ Gemini Analysis";

    badge.className =
      "badge";

  }
}


/* =========================
   DEMO MODE
========================= */

function runDemo(){

  const userInput =
    document.getElementById("input").value.trim();

  if(!userInput && !imageData){
    alert("Please enter some information, speak something, or add a photo.");
    return;
  }

  const text = userInput.toLowerCase();

  let category = "Other";
  let urgency = "Low";
  let intent = "The person wants help understanding a real-world situation and deciding what to do next.";
  let keyInfo = "";
  let missingInfo = "";
  let actionPlan = "";

  /* TRAFFIC */
  if(
    text.includes("traffic") ||
    text.includes("road") ||
    text.includes("route") ||
    text.includes("jam")
  ){

    category = "Traffic";
    urgency = "Medium";

    intent =
      "The person wants to understand the traffic situation and choose a suitable route.";

    keyInfo =
      "• Heavy traffic or a road-related problem was mentioned.\n" +
      "• The user is looking for practical travel information.\n" +
      "• An alternative route may be needed.";

    missingInfo =
      "• Exact current location\n" +
      "• Destination\n" +
      "• Current traffic conditions\n" +
      "• Available alternative routes";

    actionPlan =
      "1. Check current traffic conditions from a reliable source.\n" +
      "2. Confirm the exact starting point and destination.\n" +
      "3. Compare available alternative routes.\n" +
      "4. Choose a route using current travel information.\n" +
      "5. Re-check conditions before starting the journey.";
  }

  /* WEATHER */
  else if(
    text.includes("weather") ||
    text.includes("rain") ||
    text.includes("storm")
  ){

    category = "Weather";
    urgency = "Medium";

    intent =
      "The person wants to understand current weather conditions and plan accordingly.";

    keyInfo =
      "• A weather-related situation was mentioned.\n" +
      "• The user needs practical information for planning.";

    missingInfo =
      "• Exact location\n" +
      "• Current weather conditions\n" +
      "• Expected weather changes\n" +
      "• Travel plans";

    actionPlan =
      "1. Check the latest weather information.\n" +
      "2. Confirm the exact location.\n" +
      "3. Check warnings or alerts from reliable authorities.\n" +
      "4. Adjust plans according to verified conditions.";
  }

  /* MEDICAL */
  else if(
    text.includes("sick") ||
    text.includes("pain") ||
    text.includes("dizzy") ||
    text.includes("weak") ||
    text.includes("fever") ||
    text.includes("unwell")
  ){

    category = "Medical";
    urgency = "High";

    intent =
      "The person appears to need help deciding what information to collect and what appropriate support to seek.";

    keyInfo =
      "• The user described a health-related concern.\n" +
      "• The situation may require professional assessment.";

    missingInfo =
      "• Person's age\n" +
      "• Exact symptoms and duration\n" +
      "• Relevant medical history\n" +
      "• Current location\n" +
      "• Whether qualified help is already available";

    actionPlan =
      "1. Stay with the person and assess whether immediate help is needed.\n" +
      "2. Contact a qualified medical professional for appropriate advice.\n" +
      "3. Provide accurate information about the symptoms and situation.\n" +
      "4. If the situation appears serious or rapidly worsening, contact local emergency services.";
  }

  /* TRAVEL */
  else if(
    text.includes("travel") ||
    text.includes("bus") ||
    text.includes("train") ||
    text.includes("airport")
  ){

    category = "Travel";
    urgency = "Low";

    intent =
      "The person wants practical information to plan or manage a journey.";

    keyInfo =
      "• A travel-related request was provided.\n" +
      "• The user needs information to make a travel decision.";

    missingInfo =
      "• Starting location\n" +
      "• Destination\n" +
      "• Travel date and time\n" +
      "• Preferred transport";

    actionPlan =
      "1. Confirm the starting point and destination.\n" +
      "2. Check current transport information.\n" +
      "3. Compare available options.\n" +
      "4. Verify timings before travelling.";
  }

  /* DEFAULT */
  else {

    category = "Other";
    urgency = "Low";

    intent =
      "The person wants help understanding their situation and identifying useful next steps.";

    keyInfo =
      "• The user provided a real-world situation.\n" +
      "• The information has been interpreted from the user's input.";

    missingInfo =
      "• Exact location\n" +
      "• Current conditions\n" +
      "• Relevant supporting information\n" +
      "• Information needed for verification";

    actionPlan =
      "1. Identify the most important facts.\n" +
      "2. Identify what information is missing.\n" +
      "3. Verify important information using reliable sources.\n" +
      "4. Take appropriate next steps based on verified information.";
  }

  const result =

`INTENT:
${intent}

CATEGORY:
${category}

KEY INFORMATION:
${keyInfo}

MISSING INFORMATION:
${missingInfo}

VERIFICATION:
Facts provided:
• The information comes from the user's input.

Not verified:
• Current external conditions
• Exact location
• Any information not directly provided by the user

URGENCY:
${urgency}

ACTION PLAN:
${actionPlan}

DEMO NOTE:
This is a LifeLine AI Demo Mode response.
No Gemini API call was made.

USER INPUT:
${userInput || "Photo provided by the user."}`;

  showResult(result, "demo");
}

/* =========================
   GEMINI MODE
========================= */

async function analyzeWithGemini(){

  const apiKey =
    document.getElementById("apiKey")
    .value.trim();

  const userInput =
    document.getElementById("input")
    .value.trim();


  if(!apiKey){

    alert(
      "No approved Gemini API key is available. Use Demo Mode instead."
    );

    return;
  }


  if(!userInput && !imageData){

    alert(
      "Please enter text, speak something, or add a photo."
    );

    return;
  }


  showResult(
    "Gemini is analyzing the information...",
    "gemini"
  );


  const prompt = `

You are LifeLine AI, a universal bridge between messy human intent
and complex systems.

Analyze the user's real-world input.

Your job is NOT to invent facts.

Return a clear structured response with exactly these sections:

INTENT:
What does the person appear to need?

CATEGORY:
Medical / Travel / Weather / Traffic / News / Safety / Other

KEY INFORMATION:
List the important facts extracted from the input.

MISSING INFORMATION:
List important information that is missing.

VERIFICATION:
Clearly separate facts provided by the user from assumptions.
Never claim something is verified when it is not.

URGENCY:
Low / Medium / High / Emergency
Explain briefly.

ACTION PLAN:
Give practical next steps based only on the available information.

IMPORTANT:
For medical or emergency situations, do not diagnose.
Recommend contacting appropriate qualified professionals or emergency
services when the situation may be serious.

Keep the answer concise and easy to understand.

`;


  const parts = [

    {
      text:
        prompt +
        "\n\nUSER INPUT:\n" +
        userInput
    }

  ];


  if(imageData){

    const base64 =
      imageData.split(",")[1];

    parts.push({

      inline_data:{

        mime_type:
          document.getElementById("imageInput")
          .files[0]?.type || "image/jpeg",

        data:base64

      }

    });

  }


  try{

    const response =
      await fetch(

        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",

        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              apiKey

          },

          body:JSON.stringify({

            contents:[

              {
                parts:parts
              }

            ]

          })

        }

      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(

        data.error?.message ||
        "Gemini API request failed"

      );

    }


    const text =
      data.candidates?.[0]?.content?.parts
      ?.map(p => p.text || "")
      .join("") ||
      "No response received.";


    showResult(text, "gemini");


  }catch(error){

    showResult(

      "Gemini API Error:\n\n" +
      error.message +
      "\n\nYou can still use Demo Mode.",

      "gemini"

    );

  }

}

</script>

</body>
</html>
